<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="880" height="170" role="img" aria-label="Read the Flowcraft user manual online">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1226"/>
      <stop offset="1" stop-color="#150f33"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35e6ff"/>
      <stop offset="0.5" stop-color="#b06cff"/>
      <stop offset="1" stop-color="#35e6ff"/>
      </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ff0ff"/>
      <stop offset="1" stop-color="#c58bff"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff3ff"/>
      <stop offset="1" stop-color="#21c8e6"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#35e6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <linearGradient id="fireBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45e"/>
      <stop offset="0.55" stop-color="#ff9a1f"/>
      <stop offset="1" stop-color="#ff4a12"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3b0a"/>
      <stop offset="0.6" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ffc84a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb21e"/>
      <stop offset="1" stop-color="#fff6c2"/>
    </linearGradient>
    <filter id="heat" x="-30%" y="-80%" width="160%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.09" numOctaves="2" seed="4" result="n">
        <animate attributeName="baseFrequency" values="0.035 0.09;0.045 0.12;0.035 0.09" dur="1.6s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fireGlow" x="-40%" y="-120%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="card"><rect x="6" y="6" width="868" height="158" rx="20"/></clipPath>
  </defs>

  <!-- outer glow -->
  <rect x="6" y="6" width="868" height="158" rx="20" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.55" filter="url(#soft)"/>

  <!-- card -->
  <rect x="6" y="6" width="868" height="158" rx="20" fill="url(#bg)"/>
  <rect x="6" y="6" width="868" height="158" rx="20" fill="url(#grid)"/>
  <rect x="6" y="6" width="868" height="158" rx="20" fill="none" stroke="url(#ring)" stroke-width="2.5"/>

  <!-- book icon -->
  <g transform="translate(40 40)" filter="url(#glow)">
    <circle cx="45" cy="45" r="44" fill="#35e6ff" fill-opacity="0.08" stroke="#35e6ff" stroke-opacity="0.6" stroke-width="2"/>
    <g fill="none" stroke="#6ff0ff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M45 30c-6-4.5-14-5.5-23-4.5v33c9-1 17 0 23 4.5 6-4.5 14-5.5 23-4.5v-33c-9-1-17 0-23 4.5z"/>
      <path d="M45 30v33"/>
      <path d="M29 36c3-.5 6-.2 9 .8M29 44c3-.5 6-.2 9 .8" stroke-width="2.2"/>
      <path d="M52 36.8c3-1 6-1.3 9-.8M52 44.8c3-1 6-1.3 9-.8" stroke-width="2.2"/>
    </g>
  </g>

  <!-- text -->
  <text x="152" y="76" font-family="ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace" font-size="33" font-weight="800" letter-spacing="2" fill="url(#title)" filter="url(#glow)">READ THE USER MANUAL</text>
  <text x="153" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" fill="#a9bad6">Illustrated  ·  Interactive  ·  Searchable</text>
  <text x="153" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14.5" fill="#6f84a8">Step-by-step guides for SQA &amp; Developers — every button explained</text>

  <!-- live chip -->
  <g transform="translate(715 15)">
    <rect width="118" height="26" rx="13" fill="#37f0a8" fill-opacity="0.12" stroke="#37f0a8" stroke-opacity="0.7"/>
    <circle cx="16" cy="13" r="4.5" fill="#37f0a8"/>
    <text x="30" y="18" font-family="ui-monospace,Consolas,monospace" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#37f0a8">LIVE ONLINE</text>
  </g>

  <!-- button (fire) -->
  <g transform="translate(655 86)">
    <!-- heat glow -->
    <rect x="-6" y="-6" width="202" height="68" rx="20" fill="#ff6a13" opacity="0.6" filter="url(#fireGlow)">
      <animate attributeName="opacity" values="0.45;0.8;0.5;0.75;0.45" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <!-- flames licking up from the top edge -->
    <g filter="url(#heat)">
      <g transform="translate(16 0) scale(0.7)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.88 1.22;1.06 0.86;0.95 1.12;1 1" dur="0.9s" begin="0s" repeatCount="indefinite"/>
          <path d="M-12 0C-16 -13 -5 -18 -3 -34C2 -25 13 -18 12 0Z" fill="url(#flameOuter)"/>
          <path d="M-6 0C-8 -8 -2 -11 -1 -21C2 -15 7 -10 6 0Z" fill="url(#flameInner)"/>
        </g>
      </g>
      <g transform="translate(42 0) scale(0.95)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.88 1.22;1.06 0.86;0.95 1.12;1 1" dur="0.75s" begin="0.2s" repeatCount="indefinite"/>
          <path d="M-12 0C-16 -13 -5 -18 -3 -34C2 -25 13 -18 12 0Z" fill="url(#flameOuter)"/>
          <path d="M-6 0C-8 -8 -2 -11 -1 -21C2 -15 7 -10 6 0Z" fill="url(#flameInner)"/>
        </g>
      </g>
      <g transform="translate(70 0) scale(0.8)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.88 1.22;1.06 0.86;0.95 1.12;1 1" dur="1.0s" begin="0.4s" repeatCount="indefinite"/>
          <path d="M-12 0C-16 -13 -5 -18 -3 -34C2 -25 13 -18 12 0Z" fill="url(#flameOuter)"/>
          <path d="M-6 0C-8 -8 -2 -11 -1 -21C2 -15 7 -10 6 0Z" fill="url(#flameInner)"/>
        </g>
      </g>
      <g transform="translate(97 0) scale(1.12)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.88 1.22;1.06 0.86;0.95 1.12;1 1" dur="0.8s" begin="0.1s" repeatCount="indefinite"/>
          <path d="M-12 0C-16 -13 -5 -18 -3 -34C2 -25 13 -18 12 0Z" fill="url(#flameOuter)"/>
          <path d="M-6 0C-8 -8 -2 -11 -1 -21C2 -15 7 -10 6 0Z" fill="url(#flameInner)"/>
        </g>
      </g>
      <g transform="translate(125 0) scale(0.85)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.88 1.22;1.06 0.86;0.95 1.12;1 1" dur="0.95s" begin="0.3s" repeatCount="indefinite"/>
          <path d="M-12 0C-16 -13 -5 -18 -3 -34C2 -25 13 -18 12 0Z" fill="url(#flameOuter)"/>
          <path d="M-6 0C-8 -8 -2 -11 -1 -21C2 -15 7 -10 6 0Z" fill="url(#flameInner)"/>
        </g>
      </g>
      <g transform="translate(152 0) scale(1.0)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.88 1.22;1.06 0.86;0.95 1.12;1 1" dur="0.7s" begin="0.5s" repeatCount="indefinite"/>
          <path d="M-12 0C-16 -13 -5 -18 -3 -34C2 -25 13 -18 12 0Z" fill="url(#flameOuter)"/>
          <path d="M-6 0C-8 -8 -2 -11 -1 -21C2 -15 7 -10 6 0Z" fill="url(#flameInner)"/>
        </g>
      </g>
      <g transform="translate(177 0) scale(0.72)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.88 1.22;1.06 0.86;0.95 1.12;1 1" dur="1.05s" begin="0.15s" repeatCount="indefinite"/>
          <path d="M-12 0C-16 -13 -5 -18 -3 -34C2 -25 13 -18 12 0Z" fill="url(#flameOuter)"/>
          <path d="M-6 0C-8 -8 -2 -11 -1 -21C2 -15 7 -10 6 0Z" fill="url(#flameInner)"/>
        </g>
      </g>
    </g>
    <!-- rising embers -->
    <g>
      <circle cx="30" cy="-6" r="1.8" fill="#ffd36b">
        <animate attributeName="cy" values="-6;-46" dur="1.9s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="30;36;26" dur="1.9s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="62" cy="-6" r="1.8" fill="#ffd36b">
        <animate attributeName="cy" values="-6;-46" dur="2.3s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="62;68;58" dur="2.3s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="88" cy="-6" r="1.8" fill="#ffd36b">
        <animate attributeName="cy" values="-6;-46" dur="1.7s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.7s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="88;94;84" dur="1.7s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="118" cy="-6" r="1.8" fill="#ffd36b">
        <animate attributeName="cy" values="-6;-46" dur="2.1s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="118;124;114" dur="2.1s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="146" cy="-6" r="1.8" fill="#ffd36b">
        <animate attributeName="cy" values="-6;-46" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="146;152;142" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="168" cy="-6" r="1.8" fill="#ffd36b">
        <animate attributeName="cy" values="-6;-46" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="168;174;164" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- button body -->
    <rect x="0" y="0" width="190" height="56" rx="14" fill="url(#fireBtn)" stroke="#ffe9a8" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="3" y="3" width="184" height="24" rx="11" fill="#fff" opacity="0.16"/>
    <text x="28" y="35" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="17" font-weight="800" letter-spacing="1.8" fill="#3a0d00">OPEN NOW</text>
    <g fill="none" stroke="#3a0d00" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 28h22M164 19l9 9-9 9"/>
    </g>
  </g>
</svg>
